# git-cliff configuration for Agent Drive
# Usage:
#   git cliff --tag v0.2.0 -o CHANGELOG.md
#   git cliff --unreleased --tag v0.2.0 >> CHANGELOG.md

[changelog]
header = """
# Changelog

All notable changes to Agent Drive will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}{{ commit.scope }}: {% endif %}{{ commit.message | upper_first }}{% if commit.body %}
          {{ commit.body | indent(width=2) }}{% endif %}
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = """
<!-- generated by git-cliff -->
"""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^docs", group = "Documentation" },
    { message = "^style", group = "Styling" },
    { message = "^test", group = "Testing" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore", group = "Miscellaneous" },
]
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]*"
skip_tags = "v0.1.0"
ignore_tags = ""
topo_order = false
sort_commits = "oldest"

[remote.github]
owner = "PabloTheThinker"
repo = "agentdrive"
# Used for generating links to commits and PRs
