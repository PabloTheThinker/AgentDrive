name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A failed PR check is the cheapest possible quality gate. This workflow
# exists because before it landed, the only CI on the repo was CodeQL
# (security scanning), which meant a red branch could merge green.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install package + test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run pytest
        run: pytest tests/ -v --tb=short

      - name: Run deep functional tests
        # These live outside tests/ because they exercise full end-to-end
        # flows (healing loop, federation quarantine gate, failure modes)
        # rather than unit-scoped behavior. They are the canary suite.
        run: |
          python scripts/test_healing_loop.py
          python scripts/test_federation.py
          python scripts/test_failure_modes.py

  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: ruff
        run: ruff check src/ tests/

      - name: ruff format check
        run: ruff format --check src/ tests/

      - name: mypy
        # mypy is informational for now — the codebase has growing type
        # coverage but isn't fully typed yet. Failures are reported but do
        # not block CI. Flip `continue-on-error` to false once coverage is
        # acceptable.
        continue-on-error: true
        run: mypy src/agentdrive
