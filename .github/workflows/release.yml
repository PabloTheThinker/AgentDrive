name: Release

# Tag-driven PyPI release.
#
# Trigger by pushing an annotated tag like `v0.1.1`. The workflow:
#   1. Re-runs the full test suite (fresh checkout, no caching) to make
#      sure the tag points at green code.
#   2. Builds sdist + wheel with `python -m build`.
#   3. Uploads to PyPI via Trusted Publishing (OIDC — no API token in
#      repo secrets; the PyPI project is configured to trust this
#      workflow + tag pattern). See:
#        https://docs.pypi.org/trusted-publishers/
#   4. Creates a GitHub Release using the tag's annotation as the body.
#
# To cut a release locally:
#   ./scripts/release.sh patch --push
#
# Manual dispatch is supported for re-runs / dry runs (`dry_run=true`
# uploads to TestPyPI instead).

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Upload to TestPyPI instead of PyPI"
        type: boolean
        default: false

permissions:
  contents: write   # create GitHub Release
  id-token: write   # OIDC for PyPI Trusted Publishing

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: pytest + lint (release gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: ruff
        run: ruff check src/ tests/

      - name: ruff format check
        run: ruff format --check src/ tests/

      - name: pytest
        run: pytest tests/ -v --tb=short

      - name: Build wheel + install smoke
        run: |
          python -m build
          chmod +x scripts/install_smoke.sh
          ./scripts/install_smoke.sh

      - name: Verify tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/v}"
          proj="$(python -c 'import tomllib,sys;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$tag" != "$proj" ]; then
            echo "::error::tag v$tag does not match pyproject version $proj"
            exit 1
          fi

  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build
        run: python -m build

      - name: Check artifacts
        run: |
          python -m pip install twine
          python -m twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.dry_run == true
    environment:
      name: ${{ inputs.dry_run && 'testpypi' || 'pypi' }}
      url: ${{ inputs.dry_run && 'https://test.pypi.org/p/agentdrive' || 'https://pypi.org/p/agentdrive' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        if: inputs.dry_run == true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Extract tag annotation
        id: tag
        run: |
          set -euo pipefail
          name="${GITHUB_REF#refs/tags/}"
          body="$(git tag -l --format='%(contents)' "$name")"
          {
            echo "name=$name"
            echo "body<<EOF"
            echo "$body"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.tag.outputs.name }}
          body: ${{ steps.tag.outputs.body }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
