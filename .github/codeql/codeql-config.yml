name: "AgentDrive CodeQL config"

# Use the default security-extended query suite — broader coverage than the
# baseline, including auth/crypto / SSRF / path-traversal patterns we care
# about for a local-first agent Drive.
queries:
  - uses: security-extended

paths-ignore:
  # Test fixtures and integration scripts deliberately exercise unsanitised
  # paths to verify the production sanitisers behave correctly. Scanning
  # them produces noise without finding real bugs.
  - "tests/**"
  - "scripts/**"
  - "examples/**"
  - "docs/**"
  - "site/**"

# Note: ``query-filters`` does NOT support per-path filtering — that syntax
# is invalid and silently ignored. Per-query, per-path suppression in CodeQL
# requires either UI dismissal or a custom CodeQL query pack (out of scope).
# Production code instead inlines the CR/LF strip pattern CodeQL recognises
# directly:
#
#   str(value).replace("\r", "").replace("\n", "")  ← py/log-injection sanitiser
#
# applied at every ``logger.X(..., extra={})`` sink that receives untrusted
# input. The ``agentdrive.utils.log_safe.safe_for_log`` helper is kept for
# ergonomic use in non-flagged paths but is NOT recognised by the rule.
#
# ``utils/safe_paths.py`` IS the path-traversal sanitiser. Lines inside the
# helper unavoidably touch raw user input on the way to validation — that's
# the whole point.
