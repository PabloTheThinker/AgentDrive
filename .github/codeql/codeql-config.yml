name: "AgentDrive CodeQL config"

# Use the default security-extended query suite — broader coverage than the
# baseline, including auth/crypto / SSRF / path-traversal patterns we care
# about for a local-first agent Drive.
queries:
  - uses: security-extended

paths-ignore:
  # Test fixtures and integration scripts deliberately exercise unsanitised
  # paths to verify the production sanitisers behave correctly. Scanning
  # them produces noise without finding real bugs.
  - "tests/**"
  - "scripts/**"
  - "examples/**"
  - "docs/**"
  - "site/**"

# Query-level filters. Each entry documents WHY the alert is suppressed so a
# future operator can re-evaluate. Suppressions only apply where a runtime
# sanitiser is in place; raw-input flows in unrelated code are still scanned.
query-filters:
  # Log Injection: every untrusted value flowing into ``logger.X(..., extra={})``
  # in production code is wrapped with ``agentdrive.utils.log_safe.safe_for_log``
  # which calls ``str.replace`` (strip CR/LF/NUL) followed by
  # ``urllib.parse.quote`` (percent-encode). Both are CodeQL-recognised
  # sanitisers individually, but the rule does not always trace through the
  # helper across function boundaries. Runtime coverage proven by
  # tests/test_log_safe.py.
  - exclude:
      id: py/log-injection
      paths:
        - "src/agentdrive/drive/swarm_manager.py"
        - "src/agentdrive/backup/snapshot.py"
        - "src/agentdrive/dna/grants.py"
        - "src/agentdrive/web/app.py"
        - "src/agentdrive/web/observability.py"
        - "src/agentdrive/web/authz.py"
        - "src/agentdrive/cap/store.py"

  # URL redirection: web/app.py ``_redirect`` checks the parsed target against
  # ``_ALLOWED_REDIRECT_PATHS`` (hard-coded allowlist), refuses any path with
  # a scheme/netloc/CR/LF, percent-encodes the query via ``urllib.parse.quote``,
  # and assembles the final URL via ``urllib.parse.urlunsplit``. Runtime
  # coverage proven by tests/test_redirect_safety.py.
  - exclude:
      id: py/url-redirection
      paths:
        - "src/agentdrive/web/app.py"

# Note: utils/safe_paths.py IS the path-traversal sanitiser. Lines inside
# the helper unavoidably touch raw user input on the way to validation —
# that's the whole point.
