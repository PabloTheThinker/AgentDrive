<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="AgentDrive — Local-first storage for AI agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#12121a"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5f6fa"/>
      <stop offset="100%" stop-color="#9ca3c4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="640" cy="320" r="420" fill="url(#glow)"/>

  <!-- subtle starfield -->
  <g fill="#f5f6fa" opacity="0.35">
    <circle cx="120" cy="90" r="1"/>
    <circle cx="220" cy="180" r="0.8"/>
    <circle cx="380" cy="70" r="0.6"/>
    <circle cx="540" cy="150" r="1.1"/>
    <circle cx="720" cy="60" r="0.7"/>
    <circle cx="880" cy="110" r="1"/>
    <circle cx="1040" cy="80" r="0.8"/>
    <circle cx="1160" cy="170" r="1"/>
    <circle cx="180" cy="520" r="0.9"/>
    <circle cx="340" cy="580" r="0.6"/>
    <circle cx="500" cy="540" r="1.1"/>
    <circle cx="720" cy="580" r="0.7"/>
    <circle cx="940" cy="530" r="1"/>
    <circle cx="1100" cy="570" r="0.8"/>
  </g>

  <!-- eyebrow -->
  <text x="640" y="180" text-anchor="middle"
        font-family="ui-monospace, 'JetBrains Mono', Menlo, Monaco, Consolas, monospace"
        font-size="14" letter-spacing="4" fill="#5a6a8a" font-weight="500">
    LOCAL-FIRST&#160;·&#160;OPEN&#160;SOURCE&#160;·&#160;USER&#160;SOVEREIGN
  </text>

  <!-- wordmark -->
  <text x="640" y="340" text-anchor="middle"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="148" font-weight="800" letter-spacing="-5"
        fill="url(#wordmark)">AgentDrive</text>

  <!-- tagline -->
  <text x="640" y="420" text-anchor="middle"
        font-family="Inter, -apple-system, system-ui, sans-serif"
        font-size="34" font-weight="500" fill="#9ca3c4" letter-spacing="-0.5">
    Local-first storage for AI agents.
  </text>

  <!-- accent rule + sub-tagline -->
  <line x1="540" y1="470" x2="740" y2="470" stroke="url(#accent)" stroke-width="2"/>
  <text x="640" y="510" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif"
        font-size="18" fill="#5a6a8a" font-weight="400">
    Every agent. Every sub-agent. Its own Drive. You own it all.
  </text>
</svg>
